onboarding = false

[theme]
# catppuccin's default border/accent contrast was too low against the
# light Alabaster iTerm profile; auto-switch to the light variant there
# and keep dark catppuccin for dark terminal profiles.
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[ui]
agent_panel_sort = "priority"

[keys]
prefix = "ctrl+space"

detach = ["prefix+q", "prefix+d"]
rename_tab = "prefix+r"

new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"
resize_mode = "prefix+ctrl+r"
settings = "prefix+ctrl+s"
goto = ["prefix+g", "prefix+s", "prefix+/"]

split_vertical = ["prefix+v", "prefix+|"]

focus_pane_left = ["prefix+h", "ctrl+h"]
focus_pane_down = ["ctrl+j"]
focus_pane_up = ["ctrl+k"]
focus_pane_right = ["prefix+l", "ctrl+l"]

next_workspace = "prefix+j"
previous_workspace = "prefix+k"

# Prompt for a branch name and jump to it in its own worktree workspace,
# creating the branch/worktree if it doesn't exist yet (git-worktree-go).
# Overrides the default workspace_picker binding (prefix+w).
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "read -p 'go to worktree, branch name: ' branch && git worktree-go \"$branch\""
width = "60%"
height = "30%"

# Prompt for a project name or git URL and open/create it as a herdr
# workspace via new-project. Pauses on failure since the popup closes
# the instant the command exits and would otherwise hide clone errors.
# Overrides the default rename_pane binding (prefix+shift+p).
[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = "read -p 'open/create project, name or git url: ' input && { [ -n \"$input\" ] && new-project \"$input\" || read -p 'failed, press enter to close'; }"
width = "60%"
height = "30%"

# Toggle to the most recently used workspace (tmux-style A<->B flip), via
# the akpw.last-workspace plugin (run_onchange_after_47-herdr-plugins.sh).
[[keys.command]]
key = "prefix+tab"
type = "shell"
command = "herdr plugin action invoke toggle --plugin akpw.last-workspace"

# Move the focused workspace up/down within its repo group in the
# sidebar (herdr-move-worktree). Drag-and-drop only reorders top-level
# repo groups, not worktrees inside one, so this fills the gap.
[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr-move-worktree up"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr-move-worktree down"
